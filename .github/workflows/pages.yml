name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 静的サイトなのでビルドは無い。settings-data.json が壊れていないことだけ確かめる。
      - name: Validate settings-data.json
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('settings-data.json', encoding='utf-8'))
          assert isinstance(d.get('version'), str) and d['version'], 'version が空です'
          ids = [i['id'] for a in d['apps'] for i in a['items']]
          assert len(ids) == len(set(ids)), '項目IDが重複しています'
          for a in d['apps']:
              for i in a['items']:
                  for k in ('id', 'title', 'path', 'severity', 'why'):
                      assert i.get(k), f"{i.get('id')}: {k} が未設定です"
                  assert i['severity'] in ('high', 'medium', 'low'), f"{i['id']}: severity が不正です"
          print(f"ok: version={d['version']} apps={len(d['apps'])} items={len(ids)}")
          PY

      # Pages が未設定なら enablement: true が有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
